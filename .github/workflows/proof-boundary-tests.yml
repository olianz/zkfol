name: Rust proof-boundary tests

on:
  push:
    branches:
      - olianz/validate-proof-statement-ci

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Check formatting
        working-directory: native/zkfol_zinc_plus
        run: rustfmt --config skip_children=true --check src/lib.rs
      - name: Run Rust unit tests
        working-directory: native/zkfol_zinc_plus
        run: cargo test --lib

  elixir-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - name: Fetch Elixir dependencies
        run: mix deps.get
      - name: Run project examples
        run: mix test

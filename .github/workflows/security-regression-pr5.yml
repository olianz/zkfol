name: Security regression candidates (PR 5)
on:
  push:
    branches:
      - security/range-limb-regression-draft
  workflow_dispatch:

permissions:
  contents: read

jobs:
  range-limb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@v4
        with:
          path: contribution
      - name: Checkout pinned upstream security PR
        uses: actions/checkout@v4
        with:
          repository: olianz/zkfol
          ref: security/pr5-integrated-regressions
          path: project
      - name: Install Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: project
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Run example regression suite (including prover)
        working-directory: project
        env:
          ZKFOL_PROVE: '1'
        run: mix test test/examples_test.exs
